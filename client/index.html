<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <title>Microgenn CRM - Sales, Implementation & Support Management</title>
    <meta name="description" content="Comprehensive CRM platform for managing sales pipeline, implementation projects, and customer support tickets with seamless workflow integration." />
    
    <!-- Mobile App Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="M-CRM" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#1a2b6d" />
    <meta name="application-name" content="M-CRM" />
    
    <!-- Open Graph / Social Media Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Microgenn CRM - Sales, Implementation & Support Management" />
    <meta property="og:description" content="Comprehensive CRM platform for managing sales pipeline, implementation projects, and customer support tickets with seamless workflow integration." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:site_name" content="Microgenn CRM" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Microgenn CRM - Sales, Implementation & Support Management" />
    <meta name="twitter:description" content="Comprehensive CRM platform for managing sales pipeline, implementation projects, and customer support tickets with seamless workflow integration." />
    <meta name="twitter:image" content="/og-image.png" />
    
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap" rel="stylesheet"></noscript>
  </head>
  <body>
    <div id="root">
      <style>
        #app-loading {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #f0f2f8;
          font-family: Inter, system-ui, sans-serif;
          gap: 20px;
          z-index: 9999;
        }
        @media (prefers-color-scheme: dark) {
          #app-loading { background: #0f1629; }
          #app-loading .loading-text { color: #94a3b8; }
          #app-loading .spinner-ring { border-color: #1e3a8a22; border-top-color: #f5a623; }
        }
        .app-logo {
          display: flex;
          align-items: center;
          gap: 10px;
        }
        .app-logo-badge {
          width: 44px;
          height: 44px;
          background: #1a2b6d;
          border-radius: 10px;
          display: flex;
          align-items: center;
          justify-content: center;
          color: #f5a623;
          font-weight: 800;
          font-size: 18px;
          letter-spacing: -1px;
        }
        .app-logo-name {
          font-size: 22px;
          font-weight: 700;
          color: #1a2b6d;
          letter-spacing: -0.5px;
        }
        .spinner-ring {
          width: 36px;
          height: 36px;
          border: 3px solid #1a2b6d22;
          border-top-color: #f5a623;
          border-radius: 50%;
          animation: spin 0.75s linear infinite;
        }
        .loading-text {
          font-size: 13px;
          color: #64748b;
          letter-spacing: 0.3px;
        }
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
      <div id="app-loading">
        <div class="app-logo">
          <div class="app-logo-badge">M</div>
          <span class="app-logo-name">Microgenn CRM</span>
        </div>
        <div class="spinner-ring"></div>
        <span class="loading-text">Loading your workspace...</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((registration) => {
              console.log('M-CRM Service Worker registered:', registration.scope);
            })
            .catch((error) => {
              console.log('Service Worker registration failed:', error);
            });
        });
      }
    </script>
  </body>
</html>
